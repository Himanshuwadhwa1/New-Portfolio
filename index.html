<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          const storageKey = 'portfolio-theme'
          const storedTheme = localStorage.getItem(storageKey)
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const theme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : prefersDark ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
          const favicon = document.querySelector("link[rel='icon']")
          if (favicon) {
            favicon.href = theme === 'dark' ? '/favicon-dark.svg' : '/favicon-light.svg'
          }
        } catch (error) {
          console.error(error)
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" />
    <title>Himanshu Wadhwa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
